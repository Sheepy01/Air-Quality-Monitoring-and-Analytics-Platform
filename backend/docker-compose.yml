version: "3.9"

services:

  mysql:
    image: mysql:8.0
    container_name: air_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Sheepy01@Mysql
      MYSQL_DATABASE: air_quality_db
    ports:
      - "3306:3306"

  redis:
    image: redis:latest
    container_name: air_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: air_backend
    command: >
      sh -c "sleep 10 &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis