services:

  mysql:
    image: mysql:8.0
    container_name: air_mysql
    environment:
      MYSQL_ROOT_PASSWORD: Sheepy01@Mysql
      MYSQL_DATABASE: air_quality_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:latest
    container_name: air_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: air_backend
    command: >
      sh -c "
      echo 'Waiting for MySQL...' &&
      until nc -z mysql 3306; do
        sleep 2;
      done &&
      echo 'MySQL is up!' &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./backend:/app
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis

  frontend:
    build: ./frontend
    container_name: air_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data: